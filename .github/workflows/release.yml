name: Build installer (macOS)

# Builds Foxlite for macOS as a universal binary (Apple Silicon + Intel) and
# attaches the .dmg/.app to the workflow run as a downloadable artifact. Runs
# on every push to main, on version tags, and on demand (Actions ▸ Run
# workflow) — no GitHub Release is created, so this works on a private repo
# for sharing pre-release builds. Tag a version (v0.1.0) to also publish a
# draft GitHub Release with the same files.
#
# macOS only for now: the app is being stabilised on its primary platform
# first; other platforms get their own fork/branch later.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          # Only publish a (draft) release for version tags; plain pushes just
          # produce artifacts below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Foxlite {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: true

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target -type f -name "*.dmg" -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: foxlite-macos-universal
          path: out/*
          if-no-files-found: error
